# ==========================================
# Nginx Configuration for Frontend (React SPA)
# ==========================================

server {
    listen 80;
    server_name localhost;

    # Set root directory for Nginx static file serving
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for production performance optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Support client-side routing (React Router)
    # Checks for existence of file, directory, and falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add basic security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    }

    # Cache static assets (JS, CSS, Images, Fonts) which Vite builds with hashes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Do not cache index.html to ensure clients always load the latest build version
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Error pages configuration
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
